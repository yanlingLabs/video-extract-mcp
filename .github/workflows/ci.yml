name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    # A lockfile regenerated on npm 10 drops other platforms' binaries and can
    # lose its integrity hashes while still looking like an ordinary diff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: npm run check:lockfile

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: System binaries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim fonts-noto-cjk
      - name: System binaries (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg tesseract tesseract-lang
      - run: npm ci
      - run: npm run typecheck
      # Tests that need the ~1.5 GB speech models skip themselves; check the
      # skip count in the log, a green run does not mean they ran.
      - run: npm test
